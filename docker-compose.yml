services:
  # Face recognition service with CPU support
  facerecognition-cpu:
    profiles: ["cpu"]
    image: ghcr.io/engturtle/facerecognition-external-model-insightface:cpu
    container_name: facerecognition-cpu
    ports:
      - "8080:5000"
    environment:
      - API_KEY=${API_KEY:-some-super-secret-api-key}
      - MODEL_NAME=${MODEL_NAME:-buffalo_l}
      - MAX_DET_SIZE=${MAX_DET_SIZE:-640,640}
      - GUNICORN_WORKERS=${WORKERS:-2}
      - GUNICORN_THREADS=1
      - REQ_TIMEOUT=300
      - PRELOAD_MODELS=${PRELOAD_MODELS:-true}
      
    volumes:
      # Persist model cache
      - model-cache:/app/models
      # Optionally mount api.key file
      # - ./api.key:/app/api.key:ro
    restart: unless-stopped

  # Face recognition service with CUDA GPU support
  facerecognition-cuda:
    profiles: ["cuda"]
    image: ghcr.io/engturtle/facerecognition-external-model-insightface:cuda
    container_name: facerecognition-cuda
    ports:
      - "8080:5000"
    environment:
      - API_KEY=${API_KEY:-some-super-secret-api-key}
      - MODEL_NAME=${MODEL_NAME:-buffalo_l}
      - CUDA_DEVICE_ID=${CUDA_DEVICE_ID:-0}
      - MAX_DET_SIZE=${MAX_DET_SIZE:-640,640}
      - GUNICORN_WORKERS=1  # Usually 1 per GPU
      - PRELOAD_MODELS=true

    volumes:
      - model-cache:/app/models
    
    restart: unless-stopped
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Face recognition service with OpenVINO (Intel GPU/CPU optimization)
  facerecognition-openvino:
    profiles: ["openvino"]
    image: ghcr.io/engturtle/facerecognition-external-model-insightface:openvino
    container_name: facerecognition-openvino
    ports:
      - "8080:5000"
    environment:
      - API_KEY=${API_KEY:-some-super-secret-api-key}
      - MODEL_NAME=${MODEL_NAME:-buffalo_l}
      - OPENVINO_DEVICE_TYPE=${OPENVINO_DEVICE_TYPE:-GPU}
      - OPENVINO_PREC=${OPENVINO_PREC:-FP16}
      - MAX_DET_SIZE=${MAX_DET_SIZE:-640,640}
      - GUNICORN_WORKERS=1
      - PRELOAD_MODELS=true
    
    volumes:
      - model-cache:/app/models
    
    # For Intel GPU support, may need additional device mappings
    devices:
      - /dev/dri:/dev/dri
    
    restart: unless-stopped

volumes:
  model-cache:
    driver: local

networks:
  default:
    name: facerecognition-network
