version: 2
updates:
  # requirements-base.txt, requirements-{cpu,cuda,openvino,dev}.txt all live in
  # the repo root; Dependabot's pip ecosystem scans the whole directory for them.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Base images referenced in Dockerfile FROM lines (python:3.12-slim-bookworm,
  # nvidia/cuda:*-runtime-ubuntu24.04).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions in .github/workflows/docker-build.yml are pinned to commit SHAs;
  # Dependabot updates the SHA and the trailing version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
